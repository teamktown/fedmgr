# entity-host listens on 9631 directly: it shares ta-server's network
# namespace (compose network_mode: service:ta-server), so the leaf entity
# origin http://localhost:9631 resolves identically from the TA (its own
# loopback) and from the host (published port) — one origin everywhere,
# which the TA's same-origin enrollment check requires.
server {
    listen 9631;
    root /usr/share/nginx/html;
    # OIDF entity statements are JWTs; serve the bare files as-is.
    default_type application/entity-statement+jwt;
    location / {
        try_files $uri =404;
    }
}
