# deploy/lab/docker-compose.yml
#
# Local Trust Lab — brings up:
#   registry   — OCI registry (distribution/distribution) on :5000
#   ta-server  — Trust Anchor on :8090
#   tmi-server — Trustmark Issuer on :8080
#
# KEY POLICY:
#   Each service's decrypted private JWK lives in its own tmpfs volume.
#   Keys are never written to the host filesystem or persisted to disk.
#   Public JWKs are bind-mounted read-only from the host.
#
# Easiest start (generates keys if missing, builds, waits for health):
#   ./deploy/lab/up.sh            # stop & clean: ./deploy/lab/down.sh
#
# Manual start (keys must already exist — up.sh generates them via the step-cli
# image, no host `step` CLI needed):
#   docker compose -f deploy/lab/docker-compose.yml up --build -d
#
# Environment variables (override via .env or shell):
#   TA_ENTITY_ID   — public URL of the TA  (default http://localhost:8090)
#   TMI_ISSUER     — public URL of the TMI (default http://localhost:8080)
#
# NOTE: the secret volumes are regular shared volumes (not tmpfs) — a Docker local
# tmpfs volume is not shared across containers, so the decrypt-sidecar hand-off
# needs a real shared volume. Fine for a local lab; use a KMS / host tmpfs in prod.

networks:
  trust-lab:
    driver: bridge

volumes:
  # LAB NOTE: regular shared volumes (NOT tmpfs). A Docker `local` tmpfs volume is
  # not shared between containers — each gets its own empty RAM instance — so the
  # decrypt-sidecar → server key hand-off silently produced an empty /run/secrets.
  # For a local lab, the decrypted key sitting in a docker volume is acceptable; in
  # production use a real shared-secret channel (host tmpfs bind, or a KMS).
  tmi-secrets:
  ta-secrets:

  registry-data:

services:
  # -------------------------------------------------------------------------
  # Entity host — static HTTP host for leaf entity configurations.
  # OIDF leaves (e.g. local stdio MCP servers) must serve their self-signed
  # entity configuration at <entityId>/.well-known/openid-federation for a
  # §10 verifier to resolve them. Stdio processes have no HTTP surface, so
  # the lab hosts their statements here. Populate with:
  #   fedmgr entity config --entity-id http://localhost:9631/mcp/<name> ...
  #   (write the JWT to ./entity-host/site/mcp/<name>/.well-known/openid-federation
  #    and the public JWKS to ./entity-host/site/mcp/<name>/jwks.json)
  # It shares ta-server's network namespace so http://localhost:9631 is the
  # SAME origin from the TA (loopback), from other lab containers, and from
  # the host (port published via ta-server) — the TA's same-origin
  # enrollment check and the host-side §10 verifier see one identity.
  # -------------------------------------------------------------------------
  entity-host:
    image: nginx:alpine
    container_name: trust-lab-entity-host
    network_mode: "service:ta-server"
    depends_on:
      ta-server:
        condition: service_started
    volumes:
      - ./entity-host/site:/usr/share/nginx/html:ro
      - ./entity-host/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # OCI Registry
  # -------------------------------------------------------------------------
  registry:
    image: registry:2
    container_name: trust-lab-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    networks:
      - trust-lab
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # TA decrypt sidecar — decrypts TA private JWE into ta-secrets tmpfs
  # -------------------------------------------------------------------------
  ta-decrypt:
    image: smallstep/step-cli:latest
    container_name: trust-lab-ta-decrypt
    user: "0:0"
    volumes:
      - type: bind
        source: ../../services/ta-server/keys
        target: /keys
        read_only: true
      - ta-secrets:/run/secrets
    # step-cli image has no entrypoint; run our script under sh. Decrypt the
    # PBES2-encrypted JWK (a JWE) to plaintext on tmpfs. `step crypto jwe decrypt`
    # reads the JWE on stdin and writes the JWK to stdout.
    entrypoint: ["sh", "-c"]
    command:
      - |
        step crypto jwe decrypt --password-file /keys/.pass < /keys/ta.priv.jwe > /run/secrets/ta.priv.jwk &&
        chmod 644 /run/secrets/ta.priv.jwk &&
        echo '[ta-decrypt] TA key decrypted to tmpfs.'
    networks:
      - trust-lab

  # -------------------------------------------------------------------------
  # Trust Anchor Server
  # -------------------------------------------------------------------------
  ta-server:
    build:
      context: ../..
      dockerfile: services/ta-server/Dockerfile
    container_name: trust-lab-ta
    ports:
      - "8090:8090"
      # entity-host (network_mode: service:ta-server) listens here; published
      # through this pod so host and containers share one origin for leaf ids.
      - "9631:9631"
    volumes:
      - type: bind
        source: ../../services/ta-server/keys/ta.pub.jwk
        target: /app/keys/ta.pub.jwk
        read_only: true
      - ta-secrets:/run/secrets:ro
    environment:
      PORT: "8090"
      # The lab IS the development environment: everything speaks http://
      # (localhost + docker DNS), which the TA's URL guard only allows in
      # development. Production deployments must NOT set this.
      NODE_ENV: "development"
      # /app is not writable by the non-root `ta` user; put the SQLite DB in /tmp
      # (ephemeral, fine for a lab). Override TA_DB_PATH + a writable volume in prod.
      TA_DB_PATH: "/tmp/ta.db"
      TA_ENTITY_ID: "${TA_ENTITY_ID:-http://localhost:8090}"
      TA_JWKS_URL: "${TA_ENTITY_ID:-http://localhost:8090}/.well-known/jwks.json"
      TA_PUBLIC_JWK: "/app/keys/ta.pub.jwk"
      TA_PRIVATE_JWK: "/run/secrets/ta.priv.jwk"
      TA_ORG_NAME: "letsfederate Trust Anchor (local lab)"
      # Register TMI as a subordinate — fetched at startup.
      # entityId = the TMI's public IDENTITY (localhost, as seen from the host);
      # jwksUrl  = the in-network LOCATION (docker service DNS) so the TA can
      # actually reach it from inside the compose network. Identity != location.
      TA_SUBORDINATES: >
        [{"entityId":"${TMI_ISSUER:-http://localhost:8080}",
          "jwksUrl":"http://tmi-server:8080/.well-known/jwks.json"}]
    depends_on:
      ta-decrypt:
        condition: service_completed_successfully
      tmi-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trust-lab
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # TMI decrypt sidecar
  # -------------------------------------------------------------------------
  tmi-decrypt:
    image: smallstep/step-cli:latest
    container_name: trust-lab-tmi-decrypt
    user: "0:0"
    volumes:
      - type: bind
        source: ../../services/tmi-server/keys
        target: /keys
        read_only: true
      - tmi-secrets:/run/secrets
    # step-cli image has no entrypoint; run our script under sh. Decrypt the
    # PBES2-encrypted JWK (a JWE) to plaintext on tmpfs. `step crypto jwe decrypt`
    # reads the JWE on stdin and writes the JWK to stdout.
    entrypoint: ["sh", "-c"]
    command:
      - |
        step crypto jwe decrypt --password-file /keys/.pass < /keys/tmi.priv.jwe > /run/secrets/tmi.priv.jwk &&
        chmod 644 /run/secrets/tmi.priv.jwk &&
        echo '[tmi-decrypt] TMI key decrypted to tmpfs.'
    networks:
      - trust-lab

  # -------------------------------------------------------------------------
  # TMI Server
  # -------------------------------------------------------------------------
  tmi-server:
    build:
      context: ../..
      dockerfile: services/tmi-server/Dockerfile
    container_name: trust-lab-tmi
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ../../services/tmi-server/keys/tmi.pub.jwk
        target: /app/keys/tmi.pub.jwk
        read_only: true
      - tmi-secrets:/run/secrets:ro
    environment:
      PORT: "8080"
      TMI_ISSUER: "${TMI_ISSUER:-http://localhost:8080}"
      TMI_JWKS_URL: "${TMI_ISSUER:-http://localhost:8080}/.well-known/jwks.json"
      TMI_PUBLIC_JWK: "/app/keys/tmi.pub.jwk"
      TMI_PRIVATE_JWK: "/run/secrets/tmi.priv.jwk"
      # Declare the TA as this TMI's authority so a verifier can resolve the chain
      # TMI -> TA (required for cryptographic trust-chain validation).
      TMI_AUTHORITY_HINTS: '["${TA_ENTITY_ID:-http://localhost:8090}"]'
    depends_on:
      tmi-decrypt:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - trust-lab
    restart: unless-stopped
