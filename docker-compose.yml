services:
  federation-admin:
    build:
      context: .
      dockerfile: Dockerfile.federation-admin
      args:
        FEDMGR_BUILD_REL_NPM_DIR: ./build/npm
    ports:
      - "3001:3007"
    environment:
      - PORT=3007
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=http://localhost:3001/oauth/callback
      - FEDERATION_NAME=${FEDERATION_NAME:-alpha}
      - FEDMGR_PUBLIC_DIR=/usr/src/app/public
      - FEDMGR_KEYS_PATH=/usr/src/app/federations/${FEDERATION_NAME:-alpha}/keys
      - FEDMGR_FEDERATIONS_DIR=/usr/src/app/federations
      - FEDMGR_FED_REG_FILE=/usr/src/app/data/registry.json
      - FEDMGR_MCP_INSTANCES_DIR=/usr/src/app/mcp_instances
      - FEDMGR_KMS_PROVIDER=${FEDMGR_KMS_PROVIDER:-softkms}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-dev-only-root-token}
      - OPENBAO_TRANSIT_MOUNT=${OPENBAO_TRANSIT_MOUNT:-transit}
      - OPENBAO_TRANSIT_KEY=${OPENBAO_TRANSIT_KEY:-fedmgr-oidf-signing}
    volumes:
      # Static files (read-only)
      - ./public:/usr/src/app/public:ro
      # Federation keys (read-only)
      - ./build/install/federations/alpha/keys:/usr/src/app/federations/alpha/keys:ro
      # Entity configuration (read-only)
      - ./build/install/federations/alpha/config:/usr/src/app/federations/alpha/config:ro
    networks:
      - federation_net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3007/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp-core
      args:
        FEDMGR_BUILD_REL_NPM_DIR: ./build/npm
    ports:
      - "4001:4007"
    environment:
      - MCP_PORT=4007
      - MCP_ID=${MCP_ID:-mcp-demo}
      - MCP_PUBLIC_KEY=${MCP_PUBLIC_KEY:-mcp-demo-key}
      - MCP_BASE_URL=http://localhost:${PORT:-4007}
      - FEDERATION_ADMIN_URL=http://federation-admin:3007
      - FEDERATION_NAME=${FEDERATION_NAME:-alpha}
      - MCP_PUBLIC_DIR=/usr/src/app/public
      - FEDMGR_KEYS_PATH=/usr/src/app/mcp_instances/${MCP_ID:-mcp-demo}/keys
      - FEDMGR_FEDERATIONS_DIR=/usr/src/app/federations
      - FEDMGR_MCP_INSTANCES_DIR=/usr/src/app/mcp_instances
      - FEDMGR_KMS_PROVIDER=${FEDMGR_KMS_PROVIDER:-softkms}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-dev-only-root-token}
      - OPENBAO_TRANSIT_MOUNT=${OPENBAO_TRANSIT_MOUNT:-transit}
      - OPENBAO_TRANSIT_KEY=${OPENBAO_TRANSIT_KEY:-fedmgr-oidf-signing}
    volumes:
      # Static files (read-only)
      - ./public-mcp:/usr/src/app/public:ro
      # MCP instance keys (read-only)
      - ./build/install/mcp_instances/mcp-demo/keys:/usr/src/app/mcp_instances/mcp-demo/keys:ro
    networks:
      - federation_net
    depends_on:
      federation-admin:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:4007/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  openbao:
    image: openbao/openbao:latest
    profiles:
      - openbao
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${OPENBAO_TOKEN:-dev-only-root-token}
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command: server -dev
    volumes:
      - openbao_data:/openbao/data
    networks:
      - federation_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openbao_data:

networks:
  federation_net:
    driver: bridge
