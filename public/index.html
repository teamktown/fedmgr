<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fedmgr: Star Wars Federation Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #0f0;
    }
    #graph {
      width: 100vw;
      height: 65vh;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
    }
    #chat-input-container {
      display: flex;
      align-items: center;
      padding: 5px 10px;
      background: #111;
      border-top: 1px solid #333;
    }
    #chat-input {
      flex: 1;
      background: #000;
      color: #0f0;
      border: 1px solid #333;
      padding: 5px;
      font-family: monospace;
      font-size: 0.9em;
    }
    #send-btn {
      margin-left: 10px;
      padding: 5px 10px;
      background: #222;
      border: 1px solid #444;
      color: #0f0;
      cursor: pointer;
    }
    #telemetry-container {
      height: 25vh;
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 0.9em;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    #telemetry-title {
      padding: 5px 10px;
      background: #222;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }
    #log {
      flex: 1;
      overflow-y: scroll;
      padding: 10px;
    }
    .tooltip {
      position: absolute;
      background: #222;
      color: #fff;
      padding: 5px 10px;
      border: 1px solid #888;
      border-radius: 4px;
      pointer-events: none;
      font-size: 0.8em;
    }
    #theme-toggle {
      position: absolute;
      top: 5px;
      right: 10px;
      background: #111;
      color: #0f0;
      border: 1px solid #444;
      padding: 5px 10px;
      font-size: 0.8em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="theme-toggle">Toggle Theme</button>
  <svg id="graph"></svg>

  <div id="chat-input-container">
    <input type="text" id="chat-input" placeholder="Enter fedmgr command..." />
    <button id="send-btn">Send</button>
  </div>

  <div id="telemetry-container">
    <div id="telemetry-title">🛰️ Star Wars Command Console</div>
    <div id="log">[telemetry console starts here]</div>
  </div>
  <div class="tooltip" id="tooltip" style="display:none;"></div>

  <script>
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const logBox = document.getElementById('log');

    function logLine(msg) {
      const line = document.createElement('div');
      line.textContent = msg;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function handleFedmgrCommand(cmd) {
      const [action, type, ...rest] = cmd.split(' ');
      if (action === 'create' && type === 'fed') {
        const name = rest.join(' ');
        logLine(`[fedmgr] ✅ Federation '${name}' created.`);
      } else if (action === 'create' && type === 'mcp') {
        const name = rest.join(' ');
        logLine(`[fedmgr] ✅ MCP node '${name}' registered.`);
      } else if (cmd === 'list nodes') {
        logLine(`[fedmgr] 🔍 Currently registered nodes: Red Leader, Blue Leader, Rebel OIDC, Deathstar`);
      } else if (cmd === 'help') {
        logLine(`[fedmgr] Commands: create fed <name>, create mcp <name>, list nodes, help`);
      } else {
        logLine(`[fedmgr] ❌ Unknown command '${cmd}'`);
      }
    }

    sendBtn.onclick = () => {
      const cmd = chatInput.value.trim();
      if (cmd) {
        logLine(`[${new Date().toISOString()}] USER CMD: ${cmd}`);
        handleFedmgrCommand(cmd);
        chatInput.value = '';
      }
    };
  </script>
</body>
</html>
