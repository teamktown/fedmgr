<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fedmgr: Federation Trust Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #0f0;
    }
    #graph {
      width: 100vw;
      height: 65vh;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
    }
    #chat-input-container {
      display: flex;
      align-items: center;
      padding: 5px 10px;
      background: #111;
      border-top: 1px solid #333;
    }
    #chat-input {
      flex: 1;
      background: #000;
      color: #0f0;
      border: 1px solid #333;
      padding: 5px;
      font-family: monospace;
      font-size: 0.9em;
    }
    #send-btn {
      margin-left: 10px;
      padding: 5px 10px;
      background: #222;
      border: 1px solid #444;
      color: #0f0;
      cursor: pointer;
    }
    #telemetry-container {
      height: 25vh;
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 0.9em;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    #telemetry-title {
      padding: 5px 10px;
      background: #222;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }
    #log {
      flex: 1;
      overflow-y: scroll;
      padding: 10px;
    }
    .tooltip {
      position: absolute;
      background: #222;
      color: #fff;
      padding: 5px 10px;
      border: 1px solid #888;
      border-radius: 4px;
      pointer-events: none;
      font-size: 0.8em;
    }
    #theme-toggle {
      position: absolute;
      top: 5px;
      right: 10px;
      background: #111;
      color: #0f0;
      border: 1px solid #444;
      padding: 5px 10px;
      font-size: 0.8em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="theme-toggle">Toggle Theme</button>
  <svg id="graph"></svg>

  <div id="chat-input-container">
    <input type="text" id="chat-input" placeholder="Enter fedmgr command..." />
    <button id="send-btn">Send</button>
  </div>

  <div id="telemetry-container">
    <div id="telemetry-title">🛰️ Federation Trust Console</div>
    <div id="log">[telemetry console initializing...]</div>
  </div>
  
  <div id="mcp-protocol-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100;">
    <div style="position: relative; width: 80%; max-width: 800px; margin: 50px auto; background: #111; border: 1px solid #444; padding: 20px; color: #0f0;">
      <button id="close-modal" style="position: absolute; top: 10px; right: 10px; background: #222; border: 1px solid #444; color: #0f0; cursor: pointer;">×</button>
      <h2 id="modal-title" style="margin-top: 0;">MCP Protocol Server Details</h2>
      <div id="modal-content" style="max-height: 70vh; overflow-y: auto;"></div>
    </div>
  </div>
  <div class="tooltip" id="tooltip" style="display:none;"></div>

  <script>
    // DOM Elements
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const logBox = document.getElementById('log');
    const graphSvg = d3.select('#graph');
    const tooltip = d3.select('#tooltip');
    const themeToggle = document.getElementById('theme-toggle');
    
    // State
    let federations = [];
    let mcps = [];
    let mcpProtocolServers = [];
    let telemetrySockets = {};
    let darkTheme = true;
    
    // WebSocket connection to the server
    const serverWs = new WebSocket(`ws://${window.location.host}/ws`);
    
    // Log a message to the console
    function logLine(msg, level = 'info') {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toISOString()}] ${msg}`;
      
      // Apply styling based on log level
      if (level === 'error') {
        line.style.color = '#f55';
      } else if (level === 'success') {
        line.style.color = '#5f5';
      } else if (level === 'warning') {
        line.style.color = '#ff5';
      }
      
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }
    
    // Handle WebSocket messages from the server
    serverWs.onopen = () => {
      logLine('🔌 Connected to fedmgr server', 'success');
      // Request initial status
      serverWs.send(JSON.stringify({ type: 'get_status' }));
    };
    
    serverWs.onmessage = (event) => {
      try {
        const message = JSON.parse(event.data);
        
        if (message.type === 'status') {
          // Update our state with the latest federation, MCP, and MCP Protocol server data
          federations = message.data.federations;
          mcps = message.data.mcps;
          mcpProtocolServers = message.data.mcpProtocolServers || [];
          
          // Update the visualization
          updateVisualization();
          
          // Connect to MCP telemetry WebSockets
          connectToMcpTelemetry();
          
          logLine(`📊 Received status: ${federations.length} federations, ${mcps.length} MCPs, ${mcpProtocolServers.length} MCP Protocol servers`);
        }
      } catch (error) {
        logLine(`❌ Error processing message: ${error.message}`, 'error');
      }
    };
    
    serverWs.onclose = () => {
      logLine('🔌 Disconnected from fedmgr server', 'warning');
    };
    
    serverWs.onerror = (error) => {
      logLine(`❌ WebSocket error: ${error.message}`, 'error');
    };
    
    // Connect to MCP telemetry WebSockets
    function connectToMcpTelemetry() {
      // Close any existing connections
      Object.values(telemetrySockets).forEach(socket => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.close();
        }
      });
      
      telemetrySockets = {};
      
      // Connect to each MCP's telemetry WebSocket
      mcps.forEach(mcp => {
        const telemetryWs = new WebSocket(`ws://localhost:${mcp.port}/ws/telemetry`);
        
        telemetryWs.onopen = () => {
          logLine(`📡 Connected to ${mcp.name} telemetry`, 'success');
        };
        
        telemetryWs.onmessage = (event) => {
          try {
            const telemetry = JSON.parse(event.data);
            logLine(`📊 ${mcp.name}: ${telemetry.event} - ${telemetry.detail}`);
            
            // Update the visualization with telemetry data
            // This could highlight the active MCP, show data flow, etc.
          } catch (error) {
            logLine(`❌ Error processing telemetry from ${mcp.name}: ${error.message}`, 'error');
          }
        };
        
        telemetryWs.onclose = () => {
          logLine(`📡 Disconnected from ${mcp.name} telemetry`, 'warning');
        };
        
        telemetrySockets[mcp.name] = telemetryWs;
      });
    }
    
    // Update the D3.js visualization
    function updateVisualization() {
      // Clear the SVG
      graphSvg.selectAll('*').remove();
      
      // Set up the visualization dimensions
      const width = graphSvg.node().clientWidth;
      const height = graphSvg.node().clientHeight;
      
      // Create a group for the visualization
      const g = graphSvg.append('g')
        .attr('transform', `translate(${width/2}, ${height/2})`);
      
      // Create nodes for federations, MCPs, and MCP Protocol servers
      const nodes = [];
      
      // Add federation nodes
      federations.forEach(fed => {
        nodes.push({
          id: fed,
          type: 'federation',
          name: fed,
          radius: 40
        });
      });
      
      // Add MCP nodes
      mcps.forEach(mcp => {
        nodes.push({
          id: mcp.name,
          type: 'mcp',
          name: mcp.name,
          port: mcp.port,
          radius: 25
        });
      });
      
      // Add MCP Protocol server nodes
      mcpProtocolServers.forEach(server => {
        nodes.push({
          id: server.name,
          type: 'mcp-protocol',
          name: server.name,
          port: server.port,
          radius: 30
        });
      });
      
      // Create links between federations, MCPs, and MCP Protocol servers
      const links = [];
      
      // For now, we'll assume all MCPs and MCP Protocol servers are connected to the first federation
      // In a real implementation, we would use the authority_hints to determine connections
      if (federations.length > 0) {
        mcps.forEach(mcp => {
          links.push({
            source: federations[0],
            target: mcp.name,
            type: 'trust'
          });
        });
        
        mcpProtocolServers.forEach(server => {
          links.push({
            source: federations[0],
            target: server.name,
            type: 'trust'
          });
        });
      }
      
      // Create a force simulation
      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(150))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(0, 0))
        .force('collision', d3.forceCollide().radius(d => d.radius + 10));
      
      // Create the links
      const link = g.append('g')
        .selectAll('line')
        .data(links)
        .enter().append('line')
        .attr('stroke', '#0f0')
        .attr('stroke-width', 2)
        .attr('stroke-dasharray', d => d.type === 'trust' ? '5,5' : '0');
      
      // Create the nodes
      const node = g.selectAll('.node')
        .data(nodes)
        .enter().append('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));
      
      // Add circles for the nodes
      node.append('circle')
        .attr('r', d => d.radius)
        .attr('fill', d => {
          if (d.type === 'federation') return '#f9f';
          if (d.type === 'mcp-protocol') return '#fc9';
          return '#9cf';
        })
        .attr('stroke', '#fff')
        .attr('stroke-width', 2)
        .on('mouseover', function(event, d) {
          tooltip.style('display', 'block')
            .html(`<strong>${d.name}</strong><br>${d.type}${d.port ? `<br>Port: ${d.port}` : ''}`)
            .style('left', (event.pageX + 10) + 'px')
            .style('top', (event.pageY - 20) + 'px');
        })
        .on('mouseout', function() {
          tooltip.style('display', 'none');
        })
        .on('click', function(event, d) {
          if (d.type === 'mcp-protocol') {
            showMcpProtocolDetails(d.name);
          }
        });
      
      // Add labels to the nodes
      node.append('text')
        .attr('dy', d => d.type === 'federation' ? -45 : -30)
        .attr('text-anchor', 'middle')
        .attr('fill', '#fff')
        .text(d => d.name);
      
      // Update positions during simulation
      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        
        node
          .attr('transform', d => `translate(${d.x}, ${d.y})`);
      });
      
      // Drag functions
      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }
      
      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }
      
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
    }
    
    // Handle fedmgr commands
    async function handleFedmgrCommand(cmd) {
      const [action, type, name] = cmd.split(' ');
      
      try {
        if (action === 'create' && type === 'fed') {
          // In a real implementation, we would call the API to create a federation
          logLine(`[fedmgr] Creating federation '${name}'...`);
          logLine(`[fedmgr] ✅ Federation '${name}' created.`, 'success');
          
          // Request updated status
          serverWs.send(JSON.stringify({ type: 'get_status' }));
        }
        else if (action === 'create' && type === 'mcp') {
          // Call the API to create an MCP
          logLine(`[fedmgr] Creating MCP '${name}'...`);
          
          const response = await fetch('/api/mcps', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name })
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ MCP '${name}' created on port ${result.port}.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to create MCP: ${result.message}`, 'error');
          }
          
          // Request updated status
          serverWs.send(JSON.stringify({ type: 'get_status' }));
        }
        else if (action === 'stop' && name) {
          // Call the API to stop an MCP
          logLine(`[fedmgr] Stopping MCP '${name}'...`);
          
          const response = await fetch(`/api/mcps/${name}/stop`, {
            method: 'POST'
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ MCP '${name}' stopped.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to stop MCP: ${result.message}`, 'error');
          }
        }
        else if (action === 'restart' && name) {
          // Call the API to restart an MCP
          logLine(`[fedmgr] Restarting MCP '${name}'...`);
          
          const response = await fetch(`/api/mcps/${name}/restart`, {
            method: 'POST'
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ MCP '${name}' restarted.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to restart MCP: ${result.message}`, 'error');
          }
        }
        else if (action === 'distribute' && name) {
          // Call the API to distribute entity statements
          logLine(`[fedmgr] Distributing entity statements from federation '${name}'...`);
          
          const response = await fetch('/api/distribute', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ federation: name })
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ Entity statements distributed to ${result.distributionResults.length} MCPs.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to distribute entity statements: ${result.message}`, 'error');
          }
        }
        else if (action === 'create' && type === 'mcp-protocol') {
          // Call the API to create an MCP Protocol server
          logLine(`[fedmgr] Creating MCP Protocol server '${name}'...`);
          
          const response = await fetch('/api/mcp-protocol-servers', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name })
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ MCP Protocol server '${name}' created on port ${result.port}.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to create MCP Protocol server: ${result.message}`, 'error');
          }
          
          // Request updated status
          serverWs.send(JSON.stringify({ type: 'get_status' }));
        }
        else if (action === 'mcp-protocol' && type === 'stop' && name) {
          // Call the API to stop an MCP Protocol server
          logLine(`[fedmgr] Stopping MCP Protocol server '${name}'...`);
          
          const response = await fetch(`/api/mcp-protocol-servers/${name}/stop`, {
            method: 'POST'
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ MCP Protocol server '${name}' stopped.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to stop MCP Protocol server: ${result.message}`, 'error');
          }
        }
        else if (action === 'mcp-protocol' && type === 'restart' && name) {
          // Call the API to restart an MCP Protocol server
          logLine(`[fedmgr] Restarting MCP Protocol server '${name}'...`);
          
          const response = await fetch(`/api/mcp-protocol-servers/${name}/restart`, {
            method: 'POST'
          });
          
          const result = await response.json();
          
          if (result.success) {
            logLine(`[fedmgr] ✅ MCP Protocol server '${name}' restarted.`, 'success');
          } else {
            logLine(`[fedmgr] ❌ Failed to restart MCP Protocol server: ${result.message}`, 'error');
          }
        }
        else if (cmd === 'list') {
          // Display the current federations, MCPs, and MCP Protocol servers
          logLine(`[fedmgr] 📜 Federations:`);
          federations.forEach(fed => {
            logLine(`[fedmgr]   - ${fed}`);
          });
          
          logLine(`[fedmgr] 🤖 MCP Instances:`);
          mcps.forEach(mcp => {
            logLine(`[fedmgr]   - ${mcp.name} (http://localhost:${mcp.port})`);
          });
          
          logLine(`[fedmgr] 🔌 MCP Protocol Servers:`);
          mcpProtocolServers.forEach(server => {
            logLine(`[fedmgr]   - ${server.name} (http://localhost:${server.port})`);
          });
        }
        else if (cmd === 'help') {
          logLine(`[fedmgr] Available commands:`);
          logLine(`[fedmgr]   - create fed <name>: Create a new federation`);
          logLine(`[fedmgr]   - create mcp <name>: Create a new MCP instance`);
          logLine(`[fedmgr]   - create mcp-protocol <name>: Create a new MCP Protocol server`);
          logLine(`[fedmgr]   - stop <name>: Stop an MCP instance`);
          logLine(`[fedmgr]   - restart <name>: Restart an MCP instance`);
          logLine(`[fedmgr]   - mcp-protocol stop <name>: Stop an MCP Protocol server`);
          logLine(`[fedmgr]   - mcp-protocol restart <name>: Restart an MCP Protocol server`);
          logLine(`[fedmgr]   - distribute <federation>: Distribute entity statements`);
          logLine(`[fedmgr]   - list: List federations, MCP instances, and MCP Protocol servers`);
          logLine(`[fedmgr]   - help: Show this help message`);
        }
        else {
          logLine(`[fedmgr] ❌ Unknown command '${cmd}'`, 'error');
        }
      } catch (error) {
        logLine(`[fedmgr] ❌ Error executing command: ${error.message}`, 'error');
      }
    }
    
    // Handle command input
    sendBtn.onclick = () => {
      const cmd = chatInput.value.trim();
      if (cmd) {
        logLine(`USER CMD: ${cmd}`);
        handleFedmgrCommand(cmd);
        chatInput.value = '';
      }
    };
    
    // Allow pressing Enter to send commands
    chatInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        sendBtn.click();
      }
    });
    
    // Theme toggle
    themeToggle.addEventListener('click', () => {
      darkTheme = !darkTheme;
      
      if (darkTheme) {
        document.body.style.background = '#000';
        document.body.style.color = '#0f0';
      } else {
        document.body.style.background = '#fff';
        document.body.style.color = '#333';
      }
    });
    
    // Show MCP Protocol server details
    async function showMcpProtocolDetails(name) {
      const modal = document.getElementById('mcp-protocol-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalContent = document.getElementById('modal-content');
      
      modalTitle.textContent = `MCP Protocol Server: ${name}`;
      modalContent.innerHTML = '<p>Loading server details...</p>';
      modal.style.display = 'block';
      
      try {
        const response = await fetch(`/api/mcp-protocol-servers/${name}`);
        const data = await response.json();
        
        if (response.ok) {
          let html = `
            <div style="margin-bottom: 20px;">
              <h3>Server Information</h3>
              <p><strong>Name:</strong> ${data.name}</p>
              <p><strong>URL:</strong> <a href="${data.url}" target="_blank">${data.url}</a></p>
              <p><strong>Port:</strong> ${data.port}</p>
              <p><strong>Configuration URL:</strong> <a href="${data.config ? data.url + '/.well-known/mcp-configuration' : '#'}" target="_blank">${data.url}/.well-known/mcp-configuration</a></p>
            </div>
          `;
          
          if (data.config) {
            html += `
              <div style="margin-bottom: 20px;">
                <h3>MCP Configuration</h3>
                <pre style="background: #222; padding: 10px; overflow-x: auto;">${JSON.stringify(data.config, null, 2)}</pre>
              </div>
            `;
          }
          
          if (data.tools && data.tools.tools) {
            html += `
              <div style="margin-bottom: 20px;">
                <h3>Available Tools (${data.tools.tools.length})</h3>
                <ul>
            `;
            
            data.tools.tools.forEach(tool => {
              html += `
                <li style="margin-bottom: 10px;">
                  <strong>${tool.name}</strong>
                  <p>${tool.description}</p>
                </li>
              `;
            });
            
            html += `
                </ul>
              </div>
            `;
          }
          
          if (data.resources && data.resources.resources) {
            html += `
              <div>
                <h3>Available Resources (${data.resources.resources.length})</h3>
                <ul>
            `;
            
            data.resources.resources.forEach(resource => {
              html += `
                <li style="margin-bottom: 10px;">
                  <strong>${resource.uri}</strong>
                  <p>${resource.description}</p>
                </li>
              `;
            });
            
            html += `
                </ul>
              </div>
            `;
          }
          
          modalContent.innerHTML = html;
        } else {
          modalContent.innerHTML = `<p style="color: #f55;">Error: ${data.error || 'Failed to fetch server details'}</p>`;
        }
      } catch (error) {
        modalContent.innerHTML = `<p style="color: #f55;">Error: ${error.message}</p>`;
      }
    }
    
    // Close modal when the close button is clicked
    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('mcp-protocol-modal').style.display = 'none';
    });
    
    // Close modal when clicking outside the modal content
    document.getElementById('mcp-protocol-modal').addEventListener('click', (event) => {
      if (event.target === document.getElementById('mcp-protocol-modal')) {
        document.getElementById('mcp-protocol-modal').style.display = 'none';
      }
    });
    
    // Initialize
    logLine('🚀 Federation Trust Visualizer initialized');
    logLine('💡 Type "help" for available commands');
  </script>
</body>
</html>
